<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

/* ---------- math content (Savvas CC Grade 5, Topic 5 lessons 5-1 to 5-8) ---------- */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const f=n=>n.toLocaleString('en-US');
const hardD=(lo,hi)=>{let d;do{d=R(lo,hi)}while(Math.random()<.65&&d%10<6);return d};
const zeroQ3=()=>{const h=R(1,4),o=R(1,9);return Math.random()<.55?h*100+o:R(101,409)};
const GEN={
 // 5-1 patterns and mental math
 pattern(){let q,d;if(Math.random()<.45){const pr=pick([[4,5],[6,5],[8,5],[2,5],[4,5],[8,5]]);d=pr[1]*10*pick([1,1,10]);q=pr[0]*pick([10,100]);}else{q=R(4,9)*pick([10,100]);d=R(4,9)*10;}const n=q*d;
  return {rule:'Cross out the SAME number of zeros from both numbers. Do the basic fact. Careful: 40 ÷ 5 = 8 already used a zero!',prompt:'Use patterns. Cross out zeros, then use a basic fact.',q:`${f(n)} ÷ ${d}`,ans:q,rem:null,
   hint:`Think: ${d} × ? = ${f(n)}\nCross out one zero from each: ${f(n/10)} ÷ ${d/10}`}},
 // 5-2 estimate with compatible numbers
 estimate(){const d0=R(4,9)*10,q0=R(3,9)*pick([10,100]);const C=d0*q0;let n;do{n=C+R(-Math.round(C*.04),Math.round(C*.04));}while(n===C||n<10);
  let d;do{d=d0+R(-2,2);}while(d===d0);
  return {rule:'Change BOTH numbers to friendly numbers that divide easily (a basic fact), then divide.',prompt:'ESTIMATE with friendly (compatible) numbers.',q:`${f(n)} ÷ ${d} ≈ ?`,ans:q0,exact:n/d,rem:null,est:true,
   hint:`Friendly numbers: ${f(n)} is close to ${f(C)}, and ${d} is close to ${d0}.\n${f(C)} ÷ ${d0} = ?`}},
 // 5-3 models (2-digit quotient, area model)
 model(){const d=R(13,29),q=R(14,19);const n=d*q;
  return {rule:'Take 10 groups first. Subtract. See how many groups are left. ADD them to 10.',prompt:'Use an area model: take 10 groups first, then the rest.',q:`${f(n)} ÷ ${d}`,ans:q,rem:null,
   hint:`10 × ${d} = ${d*10}.  ${n} − ${d*10} = ${n-d*10}.\nHow many ${d}s in ${n-d*10}? Add it to 10.`}},
 // 5-4 partial quotients
 partial(){const d=hardD(23,48),q=R(31,89);const n=d*q;const t=Math.floor(q/10)*10;
  return {rule:'Take a big friendly chunk (×10, ×20, ×30…). Subtract. Repeat. Then ADD all the chunks.',prompt:'Partial quotients: take a big friendly chunk, subtract, repeat, then add the chunks.',q:`${f(n)} ÷ ${d}`,ans:q,rem:null,
   hint:`Try ${t} × ${d} = ${f(t*d)}.  ${f(n)} − ${f(t*d)} = ${f(n-t*d)}.\nHow many ${d}s in ${f(n-t*d)}? Then add.`}},
 // 5-5 standard algorithm, 3-digit by 2-digit, remainders
 algo3(){let d,q,r,n;do{d=hardD(23,89);q=Math.random()<.3?R(1,3)*10:R(12,39);r=Math.random()<.25?0:R(1,d-1);n=d*q+r;}while(n>999||n<400);
  return {prompt:'Divide. Multiply. Subtract. Bring down. (Remainder can be 0.)',q:`${f(n)} ÷ ${d}`,ans:q,rem:r,n,d,steps:true,
   hint:`Multiples ladder: ${d}, ${d*2}, ${d*3}, ${d*4}, ${d*5} …\nCheck: ${d} × quotient + remainder = ${f(n)}`}},
 // 5-6 4-digit by 2-digit
 algo4(){let d,q,r,n;do{d=hardD(23,89);q=zeroQ3();r=Math.random()<.25?0:R(1,d-1);n=d*q+r;}while(n>9999||n<2000);
  return {prompt:'Big one: 4-digit ÷ 2-digit. Estimate first, then divide.',q:`${f(n)} ÷ ${d}`,ans:q,rem:r,n,d,steps:true,
   hint:`Estimate: about ${f(Math.round(n/100)*100)} ÷ ${Math.round(d/10)*10||10}.\nLadder: ${d}, ${d*2}, ${d*3} … ${d*9}`}},
 // 5-7 choose a strategy (mix)
 mix(){return GEN[pick(['algo4','algo4','algo3','detective','missing','place','detective'])]();},
 // test traps
 detective(){let d,q,r,n;do{d=hardD(23,39);q=R(1,2)*100+R(1,9);r=R(1,d-1);n=d*q+r}while(n>9999);
  const wrong=Number(String(q).replace('0',''));
  return {rule:"Check: quotient × divisor + remainder = dividend. If the divisor doesn't fit after you bring down, write 0.",prompt:'ERROR DETECTIVE: find the mistake.',q:`Max says ${f(n)} ÷ ${d} = ${wrong} R${r}`,ans:q,rem:null,
   ph:'correct quotient',hint:`Check Max: ${wrong} × ${d} + ${r} = ${f(wrong*d+r)}, not ${f(n)}.\nRule: if ${d} doesn't fit after you bring down, write 0 in the quotient!`}},
 missing(){const d=hardD(23,68),q=R(41,189),r=R(1,d-1);
  return {rule:'dividend = quotient × divisor + remainder.',prompt:'Work BACKWARD.',q:`? ÷ ${d} = ${q} R${r}`,ans:d*q+r,rem:null,ph:'dividend',
   hint:`Rule: quotient × divisor + remainder = dividend.\n${q} × ${d} + ${r} = ?`}},
 place(){const d=hardD(23,89);const q=R(12,99)*pick([1,1,10]);const n=d*q+R(0,d-1);const Q=Math.floor(n/d);
  return {rule:'Compare the dividend with divisor × 10, × 100, × 1,000. That tells you how many digits.',prompt:'Before dividing: how many DIGITS will the quotient have?',q:`${f(n)} ÷ ${d}`,ans:String(Q).length,rem:null,ph:'digits',
   hint:`${d} × 10 = ${f(d*10)}   ${d} × 100 = ${f(d*100)}   ${d} × 1,000 = ${f(d*1000)}\nWhich two is ${f(n)} between?`}},
 // 5-8 word problems, interpret the remainder
 word(){const t=pick([0,1,2,3,4,5,6,7]);
  if(t===6){const per=hardD(23,48),n=per*R(20,80)+R(1,per-1);const full=Math.floor(n/per);return {prompt:'2-step word problem.',q:`${f(n)} pencils go in boxes of ${per}. Full boxes sell for $3 each. How many dollars for all the FULL boxes?`,ans:full*3,rem:null,word:true,hint:`Step 1: ${f(n)} ÷ ${per} = ${full} R${n%per} (only full boxes).\nStep 2: ${full} × $3.`}}
  if(t===7){const per=hardD(24,36),k=R(30,90),extra=R(1,per-1),n=per*k+extra;return {prompt:'2-step word problem.',q:`${f(n)} fans need seats. Each row has ${per} seats. Every row is filled except the last. How many fans are in the LAST row?`,ans:extra,rem:null,word:true,hint:`${f(n)} ÷ ${per} = ${k} R${extra}. The last row holds the remainder.`}}
  if(t===0){const per=R(24,52),n=per*R(4,9)+R(1,per-1);const a=Math.ceil(n/per);return {prompt:'Word problem: what does the remainder MEAN?',q:`${n} students go on a trip. Each bus holds ${per}. How many buses are needed?`,ans:a,rem:null,word:true,hint:`${n} ÷ ${per} = ${Math.floor(n/per)} R${n%per}. The leftover students still need a seat!`}}

function buildSteps(n,d){const ds=String(n).split('').map(Number);let i=0,cur=0;

  st.push({k:'S',e,rm,ask:`SUBTRACT: ${f(cur)} − ${f(pr)} = ?`,ans:rm,hint:`Rule: after you subtract, the answer must be LESS than ${d}.`});
  if(i<ds.length){const nx=rm*10+ds[i];st.push({k:'B',e,dg:ds[i],ask:`BRING DOWN the next digit (${ds[i]}). What is the new number?`,ans:nx,hint:`Rule: write the ${ds[i]} right next to ${rm}.`});cur=nx;i++}

function staticBoard(c){const m=c.q.replace(/,/g,'').match(/^(\d+) ÷ (\d+)( ≈ \?)?$/);
 if(m){const ds=m[1].split('');return `<table class="ld"><tr><td class="dv"></td><td></td>${ds.map((_,j)=>`<td class="q${j===ds.length-1?' hot':''}">${j===ds.length-1?'?':''}</td>`).join('')}</tr><tr><td class="dv">${m[2]}</td><td class="br">)</td>${ds.map(v=>`<td class="dd">${v}</td>`).join('')}</tr></table><div class="chk" style="color:#cfe9d8">Work it on paper too, then hold it up!</div>`}
 return `<div class="chalk">${c.q}</div>`}
function boardHTML(){const n=S.cur.n,d=S.cur.d;const ds=String(n).split('');const L=ds.length;
 const qrow=Array(L).fill(''),qhot=Array(L).fill(false);const rows=[];let arrow=-1;
 const place=(str,end)=>{const c=Array(L).fill('');const st=end-str.length+1;for(let j=0;j<str.length;j++)c[st+j]=str[j];return {c,st}};
 for(let i=0;i<=S.si&&i<S.st.length;i++){const x=S.st[i],pend=i===S.si;
  if(x.k==='D'){qrow[x.e]=pend?'?':String(x.qd);qhot[x.e]=pend}
  else if(x.k==='M'){const p=place(pend?'?':String(x.pr),x.e);rows.push({...p,minus:true,ul:true,hot:pend,from:x.e-String(x.pr).length+1,to:x.e})}
  else if(x.k==='S'){const p=place(pend?'?':String(x.rm),x.e);rows.push({...p,hot:pend})}
  else if(x.k==='B'){const last=rows[rows.length-1];last.c[x.e+1]=pend?'?':x.dg;last.hotCol=pend?x.e+1:-1;if(pend)arrow=x.e+1;else last.down=x.e+1}}
 const td=(v,cls)=>`<td class="${cls||''}">${v===''?'':v}</td>`;
 let h='<table class="ld"><tr><td class="dv"></td><td></td>'+qrow.map((v,j)=>td(v,'q'+(qhot[j]?' hot':''))).join('')+'</tr>';
 h+=`<tr><td class="dv">${d}</td><td class="br">)</td>`+ds.map((v,j)=>td(v,'dd'+(j===arrow?' arr':''))).join('')+'</tr>';
 rows.forEach(r=>{let g='';h+='<tr><td class="dv"></td>';
  const minusCol=r.minus?r.st-1:-9;h+=td(minusCol===-1?'−':'','ms');
  r.c.forEach((v,j)=>{let cls='';if(j===minusCol)v='−',cls='ms';if(r.ul&&j>=Math.min(r.from,r.st)&&j<=r.to)cls+=' ul';
   if(r.hot&&v==='?')cls+=' hot';if(r.hotCol===j)cls+=' hot';if(r.down===j)cls+=' bd';h+=td(v,cls)});h+='</tr>'});
 h+='</table>';
 if(S.si>=S.st.length-1&&S.st[S.st.length-1].k==='C'){h+=`<div class="chk">✓ CHECK: ${f(Math.floor(n/d))} × ${d} + ${n%d} = ${S.si>=S.st.length?f(n):'?'}</div>`}
 return h}
function renderStep(){const st=S.st[S.si];const r=$('rules');r.style.display='flex';
 r.innerHTML=['D','M','S','B','C'].map(k=>`<span class="${k===st.k?'on':''}">${RULES[k]}</span>`).join('');
 const b=$('board');b.style.display='block';b.innerHTML=boardHTML();document.body.classList.add('stepmode');
 const box=$('inputs');box.innerHTML='';const ask=document.createElement('div');ask.id='stepAsk';ask.textContent=st.ask;
 const i=document.createElement('input');i.id='a';i.inputMode='numeric';i.autocomplete='off';i.placeholder='?';i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();submit()}};
 box.style.flexDirection='column';box.append(ask,i);$('hint').textContent='';setTimeout(()=>i.focus(),30)}
function stepSubmit(){const st=S.st[S.si];const v=num($('a').value);if(isNaN(v))return;
 if(v===st.ans){S.stTries=0;if(st.k==='D')S.qs+=String(st.qd);play('ok');playClip(heroMix,heroClips,'interact-right',true);
  const p=boss.position.clone();p.y+=1.4;burst(p,0xffffff,12,3);shake=.08;
  S.si++;if(S.si>=S.st.length){$('inputs').style.flexDirection='';$('hint').textContent='';hit();return}
  if(S.st[S.si].k==='C')toast('CHECK IT!',700,'#3fdc7a');renderStep()}
 else{S.stTries++;S.streak=0;stats();play('wrong');playClip(bossMix,bossClips,'emote-no',true);
  if(S.stTries===1){$('hint').textContent='Not yet! '+st.hint;$('a').value='';$('a').focus()}
  else{$('hint').textContent=`It's ${f(st.ans)}. ${st.hint}`;S.busy=true;setTimeout(()=>{S.busy=false;S.stTries=0;if(st.k==='D')S.qs+=String(st.qd);S.si++;if(S.si>=S.st.length){$('inputs').style.flexDirection='';newQ()}else renderStep()},2600)}}}
const lbl=t=>{const l=document.createElement('label');l.textContent=t;return l};
const num=v=>v===''?NaN:Number(String(v).replace(/[, ]/g,''));
async function startLevel(i){S.lvl=i;S.hp=BOSSES[i].hp;S.busy=true;const b=BOSSES[i];
 $('bname').textContent=`${b.lesson} · ${b.name}`;$('bsub').textContent=b.sub;$('hp').style.width='0%';drawMap();
 await setBoss(i);S.busy=false;if(S.endExplore)S.endExplore=null;explore(newQ)}
function submit(){if(S.busy||!S.cur)return;const c=S.cur;if(c.steps)return stepSubmit();const a=num($('a').value);const r=$('r')?num($('r').value||'0'):null;
 if(isNaN(a)){$('a').focus();return}
 let ok;if(c.est){ok=Math.abs(a-c.ans)<=Math.max(1,c.ans*.15)||Math.abs(a-c.exact)<=Math.max(1,c.exact*.15)}else ok=a===c.ans&&(c.rem===null||r===c.rem);
 if(ok)hit();else miss()}
function hit(){S.busy=true;S.streak++;const crit=S.streak>=3&&S.streak%3===0;S.mins++;stats();
 playClip(heroMix,heroClips,'interact-right',true);
 setTimeout(()=>{const dmg=crit?2:1;S.hp=Math.max(0,S.hp-dmg);$('hp').style.width=((1-S.hp/BOSSES[S.lvl].hp)*100)+'%';
  play(crit?'loot':'ok');flash(crit?'#ffd23f':'#fff');shake=crit?.6:.25;
  const p=boss.position.clone();p.y+=1.4;burst(p,crit?0xffd23f:BOSSES[S.lvl].tint,crit?70:35,crit?8:5);
  dmgNum(crit?'⚡⚡ +2':'⚡ +1',crit);if(crit)toast('SUPER CHARGE!',900);
  if(S.cur.est)$('hint').textContent=`Nice estimate! Friendly-number answer: ${S.cur.ans}.`;
  setTimeout(()=>{if(S.hp<=0)win();else{S.busy=false;newQ()}},S.cur.est?900:550)},280)}
function miss(){S.tries++;S.streak=0;stats();play('wrong');
 playClip(bossMix,bossClips,'emote-no',true);
 const c=S.cur;
 if(S.tries===1){$('hint').textContent='Not yet! Hint:\n'+c.hint;toast('NOT YET!',700,'#ffb03a')}
 else{$('hint').textContent=`Answer: ${f(c.ans)}${c.rem!==null?' R'+c.rem:''}.\n${c.hint}\nNew problem coming…`;S.busy=true;setTimeout(()=>{S.busy=false;newQ()},3200)}
 ['a','r'].forEach(id=>{if($(id))$(id).value=''});if($('a'))$('a').focus()}
function win(){playClip(bossMix,bossClips,'emote-yes',true);play('win');S.done.add(S.lvl);drawMap();
 const p=boss.position.clone();p.y+=1;burst(p,0xffd23f,120,9);shake=.8;toast('GATE UNLOCKED!',1500);
 setTimeout(()=>{play('loot');const gem=Math.random()<.5;if(gem){S.gems++;S.mins+=2}else S.mins+=1;stats();
  $('chestIcon').textContent=gem?'💎':'🪙';$('chestTitle').textContent=gem?'DIAMOND DROP! +2 min':'Gold coin! +1 min';
  $('chestText').innerHTML=`You unlocked the gate of <b>${BOSSES[S.lvl].name}</b> (lesson ${BOSSES[S.lvl].lesson}).<br>Free time banked: <b style="color:#ffd23f">${S.mins} min</b>`+
   (S.done.size===8?'<br><br>🏆 ALL 8 GATES UNLOCKED. You are ready for Thursday.':'');
  $('chestGo').textContent='NEXT GATE ▶';$('chest').style.display='flex'},1700)}
$('skipEx').onclick=()=>{if(S.endExplore)S.endExplore()};
$('chestGo').onclick=()=>{$('chest').style.display='none';const k=ORDER.indexOf(S.lvl);const nx=ORDER.slice(k+1).find(i=>!S.done.has(i));startLevel(nx===undefined?ORDER[(k+1)%8]:nx)};
$('go').onclick=submit;
$('work').onclick=()=>{S.mins++;stats();play('ok');toast('📝 WORK SHOWN +1',800,'#3fdc7a')};
addEventListener('keydown',e=>{if(!S.play&&(e.key==='w'||e.key==='W')&&document.activeElement.tagName!=='INPUT')$('work').click()});

/* ---------- boot ---------- */
(async()=>{try{
 resize();loop();
 $('load').textContent='Loading the arena…';await scenery();
 const h=await makeChar('character-knight',2.4);hero=h.o;heroMix=h.mix;heroClips=h.clips;hero.position.set(-1.8,0,0);hero.visible=false;hero.rotation.y=0.75;scene.add(hero);playClip(heroMix,heroClips,'idle',false);
 await Promise.all(BOSSES.map(b=>load('m/'+b.model+'.glb')));
 $('load').textContent='';$('startBtn').disabled=false;$('startBtn').textContent='ENTER THE ARENA ⚔️';
}catch(e){$('load').textContent='Load error: '+e.message;console.error(e)}})();
const ORDER=[6,5,4,3,2,1,0,7];
$('startBtn').onclick=()=>{$('start').style.display='none';const first=ORDER.find(i=>!S.done.has(i));startLevel(first===undefined?6:first)};
drawMap();stats();
</script>
