<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

/* ---------- math content (Savvas CC Grade 5, Topic 5 lessons 5-1 to 5-8) ---------- */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const f=n=>n.toLocaleString('en-US');
const GEN={
 // 5-1 patterns and mental math
 pattern(){const q=R(4,9)*pick([10,100,1000]);const d=R(4,9)*10;const n=q*d;
  return {prompt:'Use patterns. Cross out zeros, then use a basic fact.',q:`${f(n)} ÷ ${d}`,ans:q,rem:null,
   hint:`Think: ${d} × ? = ${f(n)}\nCross out one zero from each: ${f(n/10)} ÷ ${d/10}`}},
 // 5-2 estimate with compatible numbers
 estimate(){const d0=R(4,9)*10,q0=R(3,9)*pick([10,100]);const C=d0*q0;let n;do{n=C+R(-Math.round(C*.04),Math.round(C*.04));}while(n===C||n<10);
  let d;do{d=d0+R(-2,2);}while(d===d0);
  return {prompt:'ESTIMATE with friendly (compatible) numbers.',q:`${f(n)} ÷ ${d} ≈ ?`,ans:q0,exact:n/d,rem:null,est:true,
   hint:`Friendly numbers: ${f(n)} is close to ${f(C)}, and ${d} is close to ${d0}.\n${f(C)} ÷ ${d0} = ?`}},
 // 5-3 models (2-digit quotient, area model)
 model(){const d=R(13,29),q=R(14,19);const n=d*q;
  return {prompt:'Use an area model: take 10 groups first, then the rest.',q:`${f(n)} ÷ ${d}`,ans:q,rem:null,
   hint:`10 × ${d} = ${d*10}.  ${n} − ${d*10} = ${n-d*10}.\nHow many ${d}s in ${n-d*10}? Add it to 10.`}},
 // 5-4 partial quotients
 partial(){const d=R(23,48),q=R(31,89);const n=d*q;const t=Math.floor(q/10)*10;
  return {prompt:'Partial quotients: take a big friendly chunk, subtract, repeat, then add the chunks.',q:`${f(n)} ÷ ${d}`,ans:q,rem:null,
   hint:`Try ${t} × ${d} = ${f(t*d)}.  ${f(n)} − ${f(t*d)} = ${f(n-t*d)}.\nHow many ${d}s in ${f(n-t*d)}? Then add.`}},
 // 5-5 standard algorithm, 3-digit by 2-digit, remainders
 algo3(){let d,q,r,n;do{d=R(23,89);q=R(12,39);r=Math.random()<.35?0:R(1,d-1);n=d*q+r;}while(n>999||n<400);
  return {prompt:'Divide. Multiply. Subtract. Bring down. (Remainder can be 0.)',q:`${f(n)} ÷ ${d}`,ans:q,rem:r,
   hint:`Multiples ladder: ${d}, ${d*2}, ${d*3}, ${d*4}, ${d*5} …\nCheck: ${d} × quotient + remainder = ${f(n)}`}},
 // 5-6 4-digit by 2-digit
 algo4(){let d,q,r,n;do{d=R(23,89);q=R(104,399);r=Math.random()<.35?0:R(1,d-1);n=d*q+r;}while(n>9999||n<3000);
  return {prompt:'Big one: 4-digit ÷ 2-digit. Estimate first, then divide.',q:`${f(n)} ÷ ${d}`,ans:q,rem:r,
   hint:`Estimate: about ${f(Math.round(n/100)*100)} ÷ ${Math.round(d/10)*10||10}.\nLadder: ${d}, ${d*2}, ${d*3} … ${d*9}`}},
 // 5-7 choose a strategy (mix)
 mix(){return GEN[pick(['pattern','partial','algo3','algo4','model'])]();},
 // 5-8 word problems, interpret the remainder
 word(){const t=pick([0,1,2,3,4,5]);
  if(t===0){const per=R(24,52),n=per*R(4,9)+R(1,per-1);const a=Math.ceil(n/per);return {prompt:'Word problem: what does the remainder MEAN?',q:`${n} students go on a trip. Each bus holds ${per}. How many buses are needed?`,ans:a,rem:null,word:true,hint:`${n} ÷ ${per} = ${Math.floor(n/per)} R${n%per}. The leftover students still need a seat!`}}
  if(t===1){const per=R(12,36),n=per*R(12,30)+R(1,per-1);return {prompt:'Word problem: what does the remainder MEAN?',q:`${f(n)} stickers go into packs of ${per}. How many FULL packs?`,ans:Math.floor(n/per),rem:null,word:true,hint:`${f(n)} ÷ ${per} = ${Math.floor(n/per)} R${n%per}. Only full packs count.`}}
  if(t===2){const per=R(12,36),n=per*R(12,30)+R(1,per-1);return {prompt:'Word problem: what does the remainder MEAN?',q:`${f(n)} cards are shared by ${per} players equally. How many cards are LEFT OVER?`,ans:n%per,rem:null,word:true,hint:`${f(n)} ÷ ${per} = ${Math.floor(n/per)} R${n%per}. The answer is the remainder.`}}
  if(t===3){const per=R(15,40),n=per*R(5,25);return {prompt:'Word problem.',q:`A Minecraft farm makes ${f(n)} wheat in ${per} days, the same each day. How much wheat per day?`,ans:n/per,rem:null,word:true,hint:`${f(n)} ÷ ${per}. Estimate first: about ${f(Math.round(n/10)*10)} ÷ ${Math.round(per/10)*10}.`}}
  if(t===4){const w=R(12,35),l=R(15,45);const a=w*l;return {prompt:'Word problem (area).',q:`A rectangle garden has an area of ${f(a)} square feet. It is ${w} feet wide. How long is it?`,ans:l,rem:null,word:true,hint:`Area = length × width, so length = ${f(a)} ÷ ${w}.`}}
  const per=R(11,24),n=per*R(20,60)+R(1,per-1);const a=Math.ceil(n/per);return {prompt:'Word problem: what does the remainder MEAN?',q:`You need to store ${f(n)} blocks. One chest holds ${per} stacks' worth (${per} blocks here). How many chests do you need for ALL of them?`,ans:a,rem:null,word:true,hint:`${f(n)} ÷ ${per} = ${Math.floor(n/per)} R${n%per}. Leftover blocks need one more chest.`}}
};
const BOSSES=[
 {lesson:'5-1',name:'ZERO ZOMBIE',sub:'Patterns & mental math',model:'character-zombie',gen:'pattern',hp:5,tint:0x66ff88},
 {lesson:'5-2',name:'ROUGHBOT 9000',sub:'Estimate with compatible numbers',model:'character-robot',gen:'estimate',hp:5,tint:0x66ccff},
 {lesson:'5-3',name:'THE AREA ALIEN',sub:'Area models',model:'character-alien',gen:'model',hp:5,tint:0xb388ff},
 {lesson:'5-4',name:'CHUNK RAIDER',sub:'Partial quotients',model:'character-raider',gen:'partial',hp:5,tint:0xffa94d},
 {lesson:'5-5',name:'SERGEANT REMAINDER',sub:'3-digit ÷ 2-digit',model:'character-soldier',gen:'algo3',hp:5,tint:0xff6b6b},
 {lesson:'5-6',name:'THE MEGA FOREMAN',sub:'4-digit ÷ 2-digit',model:'character-worker',gen:'algo4',hp:5,tint:0xffd23f},
 {lesson:'5-7',name:'THE SHAPESHIFTER',sub:'Choose a strategy',model:'character-male-e',gen:'mix',hp:6,tint:0xff4dd2},
 {lesson:'5-8',name:'QUEEN OF WORDS',sub:'Word problems & remainders',model:'character-female-d',gen:'word',hp:6,tint:0xff3d3d},
];

/* ---------- state ---------- */
const S={lvl:0,hp:0,mins:0,gems:0,streak:0,tries:0,cur:null,done:new Set(),sound:true,busy:false};
try{const s=JSON.parse(localStorage.getItem('t5g')||'{}');if(s.mins)S.mins=s.mins;if(s.gems)S.gems=s.gems;if(s.done)S.done=new Set(s.done);}catch(e){}
const save=()=>{try{localStorage.setItem('t5g',JSON.stringify({mins:S.mins,gems:S.gems,done:[...S.done]}))}catch(e){}};
const $=id=>document.getElementById(id);

/* ---------- sound ---------- */
const SND={};['hit','crit','wrong','ok','win','loot'].forEach(k=>{SND[k]=new Audio('s/'+k+'.ogg');SND[k].preload='auto'});
const play=k=>{if(!S.sound)return;const a=SND[k].cloneNode();a.volume=k==='win'?.6:.8;a.play().catch(()=>{})};
$('snd').onclick=()=>{S.sound=!S.sound;$('snd').textContent=S.sound?'🔊':'🔇'};

/* ---------- 3D scene ---------- */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;
const scene=new THREE.Scene();{const cv=document.createElement('canvas');cv.width=2;cv.height=256;const g=cv.getContext('2d');const gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#3b6fd8');gr.addColorStop(.55,'#9fd0ff');gr.addColorStop(.8,'#ffd29a');gr.addColorStop(1,'#ffb46b');g.fillStyle=gr;g.fillRect(0,0,2,256);const tx=new THREE.CanvasTexture(cv);tx.colorSpace=THREE.SRGBColorSpace;scene.background=tx;}scene.fog=new THREE.Fog(0xffd2a0,16,42);
const cam=new THREE.PerspectiveCamera(42,1,.1,200);
scene.add(new THREE.HemisphereLight(0xdff3ff,0x3a5a2a,1.1));
const sun=new THREE.DirectionalLight(0xffe0b0,2.6);sun.position.set(-7,10,6);
const rim=new THREE.DirectionalLight(0x9fc4ff,1.4);rim.position.set(4,5,-8);scene.add(rim);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-14,right:14,top:14,bottom:-14});scene.add(sun);
const ground=new THREE.Mesh(new THREE.CircleGeometry(40,64),new THREE.MeshStandardMaterial({color:0x5fb14a,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const arena=new THREE.Mesh(new THREE.CircleGeometry(4.6,48),new THREE.MeshStandardMaterial({color:0xc9a66b,roughness:1}));
arena.rotation.x=-Math.PI/2;arena.position.y=.01;arena.receiveShadow=true;scene.add(arena);
const ring=new THREE.Mesh(new THREE.RingGeometry(4.5,4.8,64),new THREE.MeshStandardMaterial({color:0x8a6a3a}));ring.rotation.x=-Math.PI/2;ring.position.y=.02;scene.add(ring);

const loader=new GLTFLoader();const cache={};
const load=url=>cache[url]||(cache[url]=new Promise((res,rej)=>loader.load(url,res,undefined,rej)));
let hero,heroMix,heroClips,boss,bossMix,bossClips,bossBase;
const actors=[];
function shadowAll(o){o.traverse(m=>{if(m.isMesh){m.castShadow=true;m.receiveShadow=true}})}
function playClip(mix,clips,name,once,fade=.15){
 const c=THREE.AnimationClip.findByName(clips,name);if(!c)return;
 const a=mix.clipAction(c);mix.stopAllAction();a.reset();a.fadeIn(fade);
 if(once){a.setLoop(THREE.LoopOnce,1);a.clampWhenFinished=true}else a.setLoop(THREE.LoopRepeat);a.play();
 if(once&&name!=='die'){const back=()=>{mix.removeEventListener('finished',back);playClip(mix,clips,'idle',false)};mix.addEventListener('finished',back)}
}
async function makeChar(name,scale){
 const g=await load('m/'+name+'.glb');const o=SkeletonUtils.clone(g.scene);o.scale.setScalar(scale);shadowAll(o);
 const mix=new THREE.AnimationMixer(o);actors.push(mix);return {o,mix,clips:g.animations};
}
async function scenery(){
 const props=[['tree',14,1.6],['tree-pine',12,1.8],['rocks',8,1.4],['barrel',4,1.2],['flag',2,1.6]];
 for(const [n,count,s] of props){const g=await load('p/'+n+'.glb');
  for(let i=0;i<count;i++){const o=g.scene.clone();const a=Math.random()*Math.PI*2;const r=(n==='flag'?5.2:7+Math.random()*12);
   if(n==='flag'){const ang=i?Math.PI*0.5:-Math.PI*0.5;o.position.set(Math.cos(ang+Math.PI/2)*5.2,0,Math.sin(ang+Math.PI/2)*-5.2-1)}
   else{const back=Math.random()<.7;const x=(Math.random()-.5)*34;const z=back?-(6+Math.random()*14):(Math.random()*6-3);o.position.set(back?x:(x<0?-1:1)*(8+Math.random()*8),0,z)}
   o.rotation.y=Math.random()*6.28;o.scale.setScalar(s*(.8+Math.random()*.5));shadowAll(o);scene.add(o)}}
}
async function setBoss(i){
 if(boss)scene.remove(boss);const b=BOSSES[i];
 const c=await makeChar(b.model,3.2);boss=c.o;bossMix=c.mix;bossClips=c.clips;
 boss.position.set(1.8,0,0);boss.rotation.y=-0.75;bossBase=boss.position.clone();scene.add(boss);
 boss.traverse(m=>{if(m.isMesh){m.material=m.material.clone();m.material.emissive=new THREE.Color(b.tint);m.material.emissiveIntensity=.18}});
 playClip(bossMix,bossClips,'idle',false);
 aura.material.color.setHex(b.tint);
}
const aura=new THREE.Mesh(new THREE.RingGeometry(.9,1.25,40),new THREE.MeshBasicMaterial({color:0xff0000,transparent:true,opacity:.55,side:THREE.DoubleSide}));
aura.rotation.x=-Math.PI/2;aura.position.set(1.8,.03,0);aura.scale.setScalar(1.4);scene.add(aura);

/* particles */
const parts=[];
function burst(pos,color,n=40,speed=5){
 for(let i=0;i<n;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(.09,.09,.09),new THREE.MeshBasicMaterial({color}));
  m.position.copy(pos);const v=new THREE.Vector3((Math.random()-.5)*speed,Math.random()*speed,(Math.random()-.5)*speed);
  scene.add(m);parts.push({m,v,life:1})}}
let shake=0;
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;
 cam.fov=w/h<1?64:42;const far=w/h<1?10:7.2;cam.position.set(0,3,far);cam.lookAt(0,w/h<1?-1.2:.5,0);cam.updateProjectionMatrix()}
addEventListener('resize',resize);
const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);const t=clock.elapsedTime;
 actors.forEach(m=>m.update(dt));
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.v.y-=12*dt;p.m.position.addScaledVector(p.v,dt);p.m.rotation.x+=dt*8;p.life-=dt*1.1;p.m.scale.setScalar(Math.max(p.life,0.01));
  if(p.life<=0||p.m.position.y<0){scene.remove(p.m);parts.splice(i,1)}}
 aura.rotation.z=t*.8;aura.material.opacity=.35+.2*Math.sin(t*4);
 const por=innerWidth/innerHeight<1;const far=por?10:7.2;
 cam.position.x=Math.sin(t*.25)*.5+(Math.random()-.5)*shake;cam.position.y=3+(Math.random()-.5)*shake;cam.position.z=far;cam.lookAt(0,por?-1.2:.5,0);
 shake*=.88;renderer.render(scene,cam)}

/* ---------- screen fx ---------- */
function toast(txt,ms=1100,color){const el=$('toast');el.textContent=txt;el.style.color=color||'';el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),ms)}
function flash(c='#fff'){const el=$('flash');el.style.background=c;el.style.opacity=.6;setTimeout(()=>el.style.opacity=0,80)}
function dmgNum(txt,crit){if(!boss)return;const v=boss.position.clone();v.y+=2.4;v.project(cam);
 const el=document.createElement('div');el.className='dmg'+(crit?' crit':'');el.textContent=txt;
 el.style.left=((v.x+1)/2*innerWidth-30)+'px';el.style.top=((1-v.y)/2*innerHeight)+'px';document.body.appendChild(el);
 requestAnimationFrame(()=>{el.style.transform=`translate(${(Math.random()-.5)*80}px,-110px)`;el.style.opacity=0});setTimeout(()=>el.remove(),950)}
function knock(o,dx){if(!o)return;const base=o===boss?bossBase:o.position.clone();let k=0;const step=()=>{k++;o.position.x=base.x+dx*Math.sin(k/10*Math.PI);if(k<10)requestAnimationFrame(step);else o.position.x=base.x};step()}
function lunge(){const x0=-1.8;let k=0;const step=()=>{k++;hero.position.x=x0+1.6*Math.sin(k/16*Math.PI);if(k<16)requestAnimationFrame(step);else hero.position.x=x0};step()}

/* ---------- UI ---------- */
function drawMap(){const m=$('map');m.innerHTML='';BOSSES.forEach((b,i)=>{const bt=document.createElement('button');bt.textContent=b.lesson;
 bt.className=(S.done.has(i)?'done ':'')+(i===S.lvl?'cur':'');bt.title=b.name+': '+b.sub;bt.onclick=()=>startLevel(i);m.appendChild(bt)})}
function stats(){$('mins').textContent=S.mins;$('gems').textContent=S.gems;$('streak').textContent=S.streak;save()}
function newQ(){S.cur=GEN[BOSSES[S.lvl].gen]();S.tries=0;const c=S.cur;$('prompt').textContent=c.prompt;$('q').textContent=c.q;$('hint').textContent='';
 const box=$('inputs');box.innerHTML='';
 const mk=(id,ph)=>{const i=document.createElement('input');i.id=id;i.placeholder=ph;i.inputMode='numeric';i.autocomplete='off';i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();if(id==='a'&&$('r')&&!$('r').value&&$('a').value)$('r').focus();else submit()}};return i};
 if(c.rem!==null){box.append(lbl('Q'),mk('a','quotient'),lbl('R'),mk('r','remainder'))}else box.append(mk('a',c.est?'estimate':'answer'));
 setTimeout(()=>$('a').focus(),50)}
const lbl=t=>{const l=document.createElement('label');l.textContent=t;return l};
const num=v=>v===''?NaN:Number(String(v).replace(/[, ]/g,''));
async function startLevel(i){S.lvl=i;S.hp=BOSSES[i].hp;S.busy=true;const b=BOSSES[i];
 $('bname').textContent=`${b.lesson} · ${b.name}`;$('bsub').textContent=b.sub;$('hp').style.width='100%';drawMap();
 await setBoss(i);S.busy=false;toast(b.name+'!',1200,'#'+b.tint.toString(16).padStart(6,'0'));newQ()}
function submit(){if(S.busy||!S.cur)return;const c=S.cur;const a=num($('a').value);const r=$('r')?num($('r').value||'0'):null;
 if(isNaN(a)){$('a').focus();return}
 let ok;if(c.est){ok=Math.abs(a-c.ans)<=Math.max(1,c.ans*.15)||Math.abs(a-c.exact)<=Math.max(1,c.exact*.15)}else ok=a===c.ans&&(c.rem===null||r===c.rem);
 if(ok)hit();else miss()}
function hit(){S.busy=true;S.streak++;const crit=S.streak>=3&&S.streak%3===0;S.mins++;stats();
 playClip(heroMix,heroClips,'attack-melee-right',true);lunge();
 setTimeout(()=>{const dmg=crit?2:1;S.hp=Math.max(0,S.hp-dmg);$('hp').style.width=(S.hp/BOSSES[S.lvl].hp*100)+'%';
  play(crit?'crit':'hit');flash(crit?'#ffd23f':'#fff');shake=crit?.6:.25;knock(boss,.7);
  const p=boss.position.clone();p.y+=1.4;burst(p,crit?0xffd23f:BOSSES[S.lvl].tint,crit?70:35,crit?8:5);
  dmgNum(crit?'CRIT! -2':'-1',crit);if(crit)toast('CRITICAL HIT!',900);
  if(S.cur.est)$('hint').textContent=`Nice estimate! Friendly-number answer: ${S.cur.ans}.`;
  setTimeout(()=>{if(S.hp<=0)win();else{S.busy=false;newQ()}},S.cur.est?900:550)},280)}
function miss(){S.tries++;S.streak=0;stats();play('wrong');
 playClip(bossMix,bossClips,'attack-melee-right',true);knock(hero,-.5);shake=.2;
 const c=S.cur;
 if(S.tries===1){$('hint').textContent='Blocked! Hint:\n'+c.hint;toast('BLOCKED!',700,'#ff4d5a')}
 else{$('hint').textContent=`Answer: ${f(c.ans)}${c.rem!==null?' R'+c.rem:''}.\n${c.hint}\nNew problem coming…`;S.busy=true;setTimeout(()=>{S.busy=false;newQ()},3200)}
 ['a','r'].forEach(id=>{if($(id))$(id).value=''});if($('a'))$('a').focus()}
function win(){playClip(bossMix,bossClips,'die',true);play('win');S.done.add(S.lvl);drawMap();
 const p=boss.position.clone();p.y+=1;burst(p,0xffd23f,120,9);shake=.8;toast('BOSS DEFEATED!',1500);
 setTimeout(()=>{play('loot');const gem=Math.random()<.5;if(gem){S.gems++;S.mins+=2}else S.mins+=1;stats();
  $('chestIcon').textContent=gem?'💎':'🪙';$('chestTitle').textContent=gem?'DIAMOND DROP! +2 min':'Gold coin! +1 min';
  $('chestText').innerHTML=`You beat <b>${BOSSES[S.lvl].name}</b> (lesson ${BOSSES[S.lvl].lesson}).<br>Free time banked: <b style="color:#ffd23f">${S.mins} min</b>`+
   (S.done.size===8?'<br><br>🏆 ALL 8 BOSSES DOWN. You are ready for Thursday.':'');
  $('chestGo').textContent='NEXT BOSS ▶';$('chest').style.display='flex'},1700)}
$('chestGo').onclick=()=>{$('chest').style.display='none';const k=ORDER.indexOf(S.lvl);const nx=ORDER.slice(k+1).find(i=>!S.done.has(i));startLevel(nx===undefined?ORDER[(k+1)%8]:nx)};
$('go').onclick=submit;
$('work').onclick=()=>{S.mins++;stats();play('ok');toast('📝 WORK SHOWN +1',800,'#3fdc7a')};
addEventListener('keydown',e=>{if((e.key==='w'||e.key==='W')&&document.activeElement.tagName!=='INPUT')$('work').click()});

/* ---------- boot ---------- */
(async()=>{try{
 resize();loop();
 $('load').textContent='Loading the arena…';await scenery();
 const h=await makeChar('character-knight',2.4);hero=h.o;heroMix=h.mix;heroClips=h.clips;hero.position.set(-1.8,0,0);hero.rotation.y=0.75;scene.add(hero);playClip(heroMix,heroClips,'idle',false);
 await Promise.all(BOSSES.map(b=>load('m/'+b.model+'.glb')));
 $('load').textContent='';$('startBtn').disabled=false;$('startBtn').textContent='ENTER THE ARENA ⚔️';
}catch(e){$('load').textContent='Load error: '+e.message;console.error(e)}})();
const ORDER=[5,4,7,6,3,2,1,0];
$('startBtn').onclick=()=>{$('start').style.display='none';const first=ORDER.find(i=>!S.done.has(i));startLevel(first===undefined?5:first)};
drawMap();stats();
</script>
</body>
</html>
